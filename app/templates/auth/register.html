<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FundScope - Create Account</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary": "#004ac6", "surface": "#f8f9fa", "on-surface": "#191c1d" },
                    fontFamily: { "headline": ["Manrope"], "body": ["Inter"] },
                },
            },
        }
    </script>
    <style>
        .primary-gradient { background: linear-gradient(135deg, #004ac6 0%, #2563eb 100%); }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-surface font-body text-on-surface h-screen flex justify-center items-center relative overflow-hidden">
    
    <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-[20%] right-[-10%] w-[500px] h-[500px] bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>

    <div class="w-full max-w-md z-10">
        <div class="text-center mb-8">
            <h1 class="font-headline text-3xl font-black text-blue-800 flex items-center justify-center space-x-2">
                <span class="material-symbols-outlined text-blue-600" style="font-variation-settings: 'FILL' 1;">analytics</span>
                <span>FundScope</span>
            </h1>
            <p class="text-gray-500 mt-2 font-medium">Create your analytical portfolio account.</p>
        </div>

        <div class="glass-panel p-10 rounded-3xl shadow-2xl border border-white/50">
            <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-5">
                
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-gray-500 block mb-2">Full Name</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">person</span>
                        <input type="text" name="name" placeholder="Aarav Sharma" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-blue-500/50 outline-none font-medium text-gray-800 transition-all">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-gray-500 block mb-2">Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">mail</span>
                        <input type="email" name="email" placeholder="aarav@example.com" required class="w-full bg-gray-50 border border-gray-200 rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-blue-500/50 outline-none font-medium text-gray-800 transition-all">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-gray-500 block mb-2">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
                        <input type="password" name="password" placeholder="••••••••" required minlength="6" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-blue-500/50 outline-none font-medium text-gray-800 transition-all">
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full primary-gradient text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:-translate-y-1 hover:shadow-blue-500/30 transition-all">
                        Create Account
                    </button>
                </div>
            </form>

            <div class="mt-8 pt-8 border-t border-gray-200 text-center">
                <p class="text-sm font-medium text-gray-600">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-blue-600 font-bold">Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
